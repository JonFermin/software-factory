[project]
name = "software-factory"
version = "0.1.0"
description = "Local, scheduled factory: Linear is the source of truth; deterministic engine dispatches narrow Claude workers that propose, the engine acts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "httpx>=0.27",
    "pydantic>=2.8",
    "typer>=0.12",
    "filelock>=3.15",
    "desktop-notifier>=6.0",
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/JonFermin/software-factory"

[project.scripts]
factory = "software_factory.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
